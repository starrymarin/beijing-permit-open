[package]
name = "beijing-permit-open"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust client for the Beijing entry permit application workflow"
repository = "https://github.com/starrymarin/beijing-permit-open"
readme = "README.md"
keywords = ["beijing", "permit", "open"]
include = ["/src", "/examples", "/README.md", "/LICENSE", "/.gitignore"]

[dependencies]
base64 = "0.22"
openssl = "0.10"
percent-encoding = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
